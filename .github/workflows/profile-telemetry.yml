name: Refresh profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_telemetry.py

      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet -- assets/lab-telemetry.svg; then
            echo "Telemetry unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lab-telemetry.svg
          git commit -m "chore: refresh profile telemetry"
          git push
